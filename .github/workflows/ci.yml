name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 \
            libsdl2-2.0-0 \
            libnotify4 \
            libsm6 \
            libxtst6 \
            libxxf86vm1 \
            xvfb

      - name: Install launcher
        run: |
          python -m pip install -U pip
          if [ "${{ runner.os }}" = "Linux" ]; then
            python -m pip install -e ".[test]"
            python -m pip install "numpy" "six"
          else
            python -m pip install -e ".[gui,test]"
          fi

      - name: Install Linux wxPython
        if: runner.os == 'Linux'
        run: |
          extras_url="https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04"
          attempt=1
          max_attempts=3
          while true; do
            if python -m pip install --timeout 120 \
              --no-index --only-binary=:all: --no-deps \
              -f "$extras_url" \
              "wxPython==4.2.5"; then
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "wxPython==4.2.5 install failed after ${max_attempts} attempts" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "Retrying wxPython install (attempt ${attempt}/${max_attempts})..."
            sleep 5
          done

      - name: Test
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a python -m unittest discover -s tests -v
          else
            python -m unittest discover -s tests -v
          fi
